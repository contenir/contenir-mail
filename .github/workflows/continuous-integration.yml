name: "Continuous Integration"

on:
  push:
  pull_request:

jobs:
  qa:
    uses: contenir/contenir-qa-tools/.github/workflows/continuous-integration.yml@0.1.x
    secrets: inherit
    with:
      php-versions: '["8.3", "8.4", "8.5"]'
      coverage-php-version: "8.4"
      # The suite inherited from laminas-mail does not yet meet the mutation
      # score Contenir packages are held to; enable once it does.
      enable-infection: false
